<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポジティブ占い | Thasyu World</title>
  <link rel="stylesheet" href="/game/fortune.css">
</head>
<body>

  <!-- 背景の浮遊エフェクト -->
  <div class="floating-eyes"></div>
  <div class="floating-eyes"></div>
  <div class="floating-eyes"></div>

<!-- Now Loading -->
<div id="loading-screen">
  <div class="loading-content">
    <span class="loading-text">Now Loading</span>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<!-- 占いコンテンツは最初非表示 -->
<div class="fortune-container" id="fortuneContainer" style="display:none;">
  <h1 class="title">ポジティブ占い ✨</h1>
  <button id="startFortuneBtn">🎟 占う</button>
  <div id="fortune-result-container" style="opacity:0; display:none;">
    <p id="fortune-result"></p>
    <p id="positive-msg"></p>
    <p id="lucky-color"></p>
    <button id="repeatFortuneBtn" style="display:none;">もう一度占う</button>
  </div>
  <button id="backBtn">ゲームコーナーに戻る</button>
</div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/game/fortune.js"></script>
</body>
</html>
