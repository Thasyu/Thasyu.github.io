<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thasyu World | 2048 Game</title>

  <!-- 2048専用CSS -->
  <link rel="stylesheet" href="2048game.css" />
  <!-- JS -->
  <script src="2048game.js" defer></script>
</head>
<body>

  <!-- Now Loading -->
  <div id="loading-screen">
    <div class="loading-content">
      <span class="loading-text">Now Loading</span>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <canvas id="sparkleCanvas"></canvas>
  <div class="sidebar-blocker"></div>
  <aside class="sidebar">
    <h2>メニュー</h2>
    <!-- 🌸 Restartボタンをメニューのすぐ下に配置 -->
    <div class="menu-buttons">
      <button id="restart">リセット</button>
    </div>
    <div class="bottom-btn">
      <a href="/game">ゲームコーナーに戻る</a>
    </div>
  </aside>

  <div class="main-content">
    <div class="content-right">
      <section class="game-section horizontal-layout">
        
        <!-- 🎮 ボード -->
        <div class="game-card">
          <h2>🎀 2048 Sweet Sugar Game 🎀</h2>
          <p>キラキラ・ピンクの世界で2048を楽しもう！</p>
          <div class="grid-container"></div>
          <div class="score-container">
            <span>Score: </span><span id="score">0</span>
          </div>
        </div>

        <!-- 📊 右情報パネル -->
        <div class="info-panel">
          <h3>ルール説明</h3>
          <p>
            1. 矢印キーでタイルを上下左右に動かします。<br>
            2. 同じ数字のタイルがぶつかると合体して2倍になります。<br>
            3. 2048のタイルを作ることが目標です。<br>
            4. 盤面がいっぱいで動かせなくなったらゲームオーバーです。<br>
            5. リスタートボタンでいつでもゲームを最初から始められます。
          </p>
        </div>

      </section>
    </div>
  </div>
</body>
</html>
