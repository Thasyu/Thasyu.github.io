<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Thasyu Worldの公式ページ">
	<title>Thasyu World</title>

	<!-- CSS -->
	<link rel="stylesheet" href="css/style.css">

	<!-- JS -->
	<script src="js/main.js" defer></script>

	<!-- スクロールをスムーズに -->
	<style>
		html {
			scroll-behavior: smooth;
		}
	</style>
</head>

<body id="top">

	<!-- ヒーローセクション -->
	<div class="hero">
		<div class="overlay"></div>

		<!-- メインコンテンツ -->
		<div class="content">
			<h1 class="fade-in">Welcome to Thasyu World</h1>
			<p class="fade-in delay">チャシューによる最高の世界へ</p>
		</div>
	</div>

	<!-- Services セクション -->
	<section id="services" class="section service-section">
		<h2 class="fade-in-up">Services</h2>
		<div class="service-items">
			<div class="item fade-in-up delay">サービスAについての説明</div>
			<div class="item fade-in-up delay2">サービスBについての説明</div>
			<div class="item fade-in-up delay3">サービスCについての説明</div>
		</div>
	</section>

	<!-- Contact セクション -->
	<section id="contact" class="section contact-section">
		<h2 class="fade-in-up">Contact</h2>
		<p class="fade-in-up delay">お問い合わせはこちらからどうぞ。</p>
		<a href="#top" class="btn fade-in-up delay3">トップに戻る</a>
	</section>

	<!-- シャボン玉コンテナ -->
	<div class="bubble-container"></div>

	<!-- JS for bubbles -->
	<script src="js/bubble.js"></script>

</body>
</html>
