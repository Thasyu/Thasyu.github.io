<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thasyu World 新規登録</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/login.css">

  <!-- JS -->
  <script src="js/register.js" defer></script>
</head>
<body>
  <div class="login-container">
    <h1 class="title">Thasyu World</h1>
    <p class="subtitle">アカウントを作成してあなたの世界へ</p>

    <form method="POST" action="/register" id="registerForm">
      <div class="input-group">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" placeholder="例: Thasyu" required>
      </div>

      <div class="input-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
      </div>

      <div class="input-group">
        <label for="passwordConfirm">パスワード確認</label>
        <input type="password" id="passwordConfirm" placeholder="もう一度パスワードを入力" required>
      </div>

      <button type="submit" class="login-btn">登録</button>
      <p id="error-message" style="color:red;"></p>
    </form>

    <p class="register-link">
      既にアカウントをお持ちの方は <a href="/login">ログイン</a>
    </p>
  </div>

  <script>
    // パスワード確認チェック
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const passwordConfirm = document.getElementById('passwordConfirm');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', (e) => {
      if (password.value !== passwordConfirm.value) {
        e.preventDefault();
        errorMessage.textContent = "パスワードが一致しません";
      }
    });
  </script>
</body>
</html>
