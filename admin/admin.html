<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ管理画面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fff0f5;
      color: #333;
    }
    h1 {
      color: #ff69b4;
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      border: 1px solid #ffb6c1;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ffb6c1;
      text-align: left;
    }
    th {
      background-color: #ffe4f1;
      color: #ff1493;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tbody {
      display: block;
      max-height: 500px;
      overflow-y: auto;
    }
    thead, tbody tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    caption {
      caption-side: top;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>お問い合わせ管理画面</h1>
  <table>
    <caption>問い合わせ一覧</caption>
    <thead>
      <tr>
        <th>日時</th>
        <th>名前</th>
        <th>メール</th>
        <th>内容</th>
      </tr>
    </thead>
    <tbody id="logs">
      <tr><td colspan="4">読み込み中...</td></tr>
    </tbody>
  </table>

  <script>
    async function loadLogs() {
      try {
        const res = await fetch('/admin/logs');
        if (!res.ok) throw new Error('ログ取得に失敗しました');
        const text = await res.text();

        const tbody = document.getElementById('logs');
        tbody.innerHTML = '';

        // 各行を分割してテーブルに
        const lines = text.trim().split('\n');
        lines.forEach(line => {
          const [datetime, name, email, message] = line.split(' | ');
          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td>${datetime || ''}</td>
            <td>${name || ''}</td>
            <td>${email || ''}</td>
            <td>${message || ''}</td>
          `;
          tbody.appendChild(tr);
        });

        if (lines.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">ログがありません</td></tr>';
        }
      } catch (err) {
        document.getElementById('logs').innerHTML = `<tr><td colspan="4">エラー: ${err.message}</td></tr>`;
        console.error(err);
      }
    }

    loadLogs();
    // 30秒ごとに自動更新
    setInterval(loadLogs, 30000);
  </script>
</body>
</html>
