<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thasyu World ログインページ" />
  <title>Thasyu World ログイン</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/login.css" />

  <!-- JS -->
  <script src="js/login.js" defer></script>
</head>
<body>

  <div class="login-container">
    <h1 class="title">Thasyu World</h1>
    <p class="subtitle">ログインしてあなたの世界へ</p>

    <form action="/login" method="POST">
      <div class="input-group">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" placeholder="例: Thasyu" required />
      </div>

      <div class="input-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" required />
      </div>

      <button type="submit" class="login-btn">ログイン</button>
      <p id="error-message"></p>
    </form>
  </div>

</body>
</html>
