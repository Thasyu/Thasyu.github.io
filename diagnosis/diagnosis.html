<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あなたはどんなちゃしゅまるタイプ？</title>

  <link rel="stylesheet" href="diagnosis.css">

  <script src="diagnosis.js" defer></script>
  <script src="nature.js" defer></script>

</head>
<body>
  <header class="page-header">
    <h1>あなたはどんなちゃしゅまるタイプ？</h1>
    <p class="subtitle">質問に答えて、自分のちゃしゅまるタイプを診断しよう！</p>
  </header>

  <main class="main-area">

    <!-- 質問エリア -->
    <section id="quiz" class="card-area"></section>

    <!-- 結果エリア -->
    <section id="result" class="card-area result">
      <h2 id="result-title"></h2>
      <img id="result-img" src="" alt="ちゃしゅまる">
      <p id="result-comment"></p>
      <p id="result-detail"></p>
      <div class="buttons">
        <button id="restart-btn">もう一度診断する</button>
        <button id="share-btn">結果をシェアする</button>
      </div>
    </section>
  </main>

  <footer class="back-home-container">
    <a href="/" class="back-home">トップページに戻る</a>
  </footer>

    <!-- 雲用Canvas -->
    <canvas id="clouds"></canvas>
    <!-- 水面用Canvas -->
    <canvas id="water"></canvas>  
    <!-- 🌠 ピンクの流れ星レイヤー -->
    <div id="shooting-stars" aria-hidden="true"></div>

</body>
</html>
